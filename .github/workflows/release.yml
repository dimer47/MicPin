name: Publication

# Sur une poussée de tag « v… », compile en Release, signe avec le certificat
# Developer ID, fait notariser par Apple, agrafe le ticket, fabrique le disque
# d'installation et publie la release.
#
# Trois secrets sont nécessaires (voir docs/publication.md) :
#
#   CERTIFICAT_P12_BASE64      certificat Developer ID exporté, encodé en base64
#   CERTIFICAT_MOT_DE_PASSE    mot de passe de ce fichier .p12
#   NOTARISATION_MOT_DE_PASSE  mot de passe d'application Apple
#   IDENTIFIANT_APPLE          adresse du compte développeur Apple
#
# L'identifiant Apple est un secret plutôt qu'une variable : le dépôt est
# public, et une adresse en clair dans un fichier versionné finit récoltée.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier, par exemple v1.1.0"
        required: true

env:
  # L'identifiant d'équipe reste en clair : il est de toute façon lisible dans
  # la signature de tout binaire distribué (codesign -dv), et le vérificateur
  # de mise à jour doit le connaître pour refuser un disque signé par un tiers.
  EQUIPE_APPLE: 5D6QHL72QC

jobs:
  publier:
    name: Compiler, notariser et publier
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v5

      # Le certificat est importé dans un trousseau temporaire, propre à cette
      # exécution : il disparaît avec la machine virtuelle.
      - name: Importer le certificat de signature
        env:
          CERTIFICAT_P12_BASE64: ${{ secrets.CERTIFICAT_P12_BASE64 }}
          CERTIFICAT_MOT_DE_PASSE: ${{ secrets.CERTIFICAT_MOT_DE_PASSE }}
        run: |
          TROUSSEAU="$RUNNER_TEMP/signature.keychain-db"
          MOT_DE_PASSE_TROUSSEAU="$(uuidgen)"
          CERTIFICAT="$RUNNER_TEMP/certificat.p12"

          if [ -z "$CERTIFICAT_P12_BASE64" ]; then
            echo "::error::Le secret CERTIFICAT_P12_BASE64 est vide. Enregistrez-le depuis un fichier : gh secret set CERTIFICAT_P12_BASE64 --repo … < cert.b64"
            exit 1
          fi

          if [ -z "$CERTIFICAT_MOT_DE_PASSE" ]; then
            echo "::error::Le secret CERTIFICAT_MOT_DE_PASSE est vide. Un .p12 exporté sans mot de passe ne peut pas être importé par macOS : réexportez le certificat en en choisissant un."
            exit 1
          fi

          # tr supprime les retours ligne éventuels : certains outils de copie en
          # introduisent, et le décodage échouerait sans message clair.
          echo "$CERTIFICAT_P12_BASE64" | tr -d '\n\r ' | base64 --decode > "$CERTIFICAT"

          TAILLE="$(wc -c < "$CERTIFICAT" | tr -d ' ')"
          echo "Certificat décodé : $TAILLE octets"
          if [ "$TAILLE" -lt 1000 ]; then
            echo "::error::Le certificat décodé fait $TAILLE octets, ce qui est trop peu pour un .p12 contenant une clé privée."
            exit 1
          fi

          security create-keychain -p "$MOT_DE_PASSE_TROUSSEAU" "$TROUSSEAU"
          security set-keychain-settings -lut 21600 "$TROUSSEAU"
          security unlock-keychain -p "$MOT_DE_PASSE_TROUSSEAU" "$TROUSSEAU"

          # -f pkcs12 et -A sont nécessaires : sans le format explicite,
          # SecKeychainItemImport rejette le fichier avec un « invalid
          # parameters » peu explicite.
          security import "$CERTIFICAT" \
            -k "$TROUSSEAU" \
            -P "$CERTIFICAT_MOT_DE_PASSE" \
            -f pkcs12 \
            -A \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          # Sans cette autorisation, codesign demanderait une confirmation
          # interactive, impossible sur un runner.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$MOT_DE_PASSE_TROUSSEAU" \
            "$TROUSSEAU" >/dev/null

          security list-keychain -d user -s "$TROUSSEAU" login.keychain-db

          EMPREINTE="$(security find-identity -v -p codesigning "$TROUSSEAU" \
            | grep 'Developer ID Application' \
            | head -1 \
            | awk '{print $2}')"

          if [ -z "$EMPREINTE" ]; then
            echo "::error::Aucun certificat Developer ID trouvé dans le trousseau importé."
            exit 1
          fi

          echo "EMPREINTE_SIGNATURE=$EMPREINTE" >> "$GITHUB_ENV"
          echo "Certificat importé : $EMPREINTE"

      - name: Enregistrer les identifiants de notarisation
        env:
          NOTARISATION_MOT_DE_PASSE: ${{ secrets.NOTARISATION_MOT_DE_PASSE }}
        run: |
          xcrun notarytool store-credentials "micpin" \
            --apple-id "${{ secrets.IDENTIFIANT_APPLE }}" \
            --team-id "$EQUIPE_APPLE" \
            --password "$NOTARISATION_MOT_DE_PASSE"

      - name: Déterminer la version
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          # Le tag porte un « v » que le numéro de version ne garde pas.
          echo "VERSION_TAG=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_APP=${VERSION#v}" >> "$GITHUB_ENV"
          echo "Version publiée : ${VERSION#v}"

      - name: Inscrire la version dans le projet
        run: |
          # La version affichée par l'app doit correspondre au tag : c'est elle
          # que le vérificateur de mise à jour compare à la dernière release.
          /usr/libexec/PlistBuddy -c \
            "Set :CFBundleShortVersionString $VERSION_APP" MicPin/Info.plist
          /usr/libexec/PlistBuddy -c \
            "Set :CFBundleVersion ${{ github.run_number }}" MicPin/Info.plist

      - name: Lancer les tests
        run: |
          xcodebuild -project MicPin.xcodeproj \
            -scheme MicPin \
            -configuration Debug \
            -derivedDataPath build-tests \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Compiler avec la signature de distribution
        run: |
          xcodebuild -project MicPin.xcodeproj \
            -scheme MicPin \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="$EMPREINTE_SIGNATURE" \
            DEVELOPMENT_TEAM="$EQUIPE_APPLE" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_ENTITLEMENTS="MicPin/MicPin.entitlements" \
            ENABLE_HARDENED_RUNTIME=YES \
            OTHER_CODE_SIGN_FLAGS="--timestamp --options=runtime" \
            build

      # Xcode ajoute get-task-allow d'office, y compris en Release : Apple
      # rejette toute soumission qui le déclare.
      - name: Resigner sans le droit de débogage
        run: |
          APP="build/Build/Products/Release/MicPin.app"
          codesign --force \
            --sign "$EMPREINTE_SIGNATURE" \
            --entitlements "MicPin/MicPin.entitlements" \
            --options runtime \
            --timestamp \
            "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Vérifier la version embarquée
        run: |
          APP="build/Build/Products/Release/MicPin.app"
          EMBARQUEE="$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")"

          echo "Version dans l'application : $EMBARQUEE"
          echo "Version attendue           : $VERSION_APP"

          if [ "$EMBARQUEE" != "$VERSION_APP" ]; then
            echo "::error::L'application se déclare en $EMBARQUEE alors que le tag annonce $VERSION_APP."
            exit 1
          fi

      - name: Faire notariser l'application
        run: |
          APP="build/Build/Products/Release/MicPin.app"
          mkdir -p build/distribution
          ditto -c -k --keepParent "$APP" build/distribution/MicPin.zip

          xcrun notarytool submit build/distribution/MicPin.zip \
            --keychain-profile "micpin" \
            --wait \
            --timeout 30m

          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

      - name: Fabriquer le disque d'installation
        run: |
          APP="build/Build/Products/Release/MicPin.app"
          MONTAGE="$(mktemp -d)"

          cp -R "$APP" "$MONTAGE/MicPin.app"
          # Le lien vers /Applications permet d'installer par glisser-déposer.
          ln -s /Applications "$MONTAGE/Applications"

          hdiutil create \
            -volname "MicPin" \
            -srcfolder "$MONTAGE" \
            -ov -format UDZO \
            "build/distribution/MicPin.dmg"

          rm -rf "$MONTAGE"

          codesign --sign "$EMPREINTE_SIGNATURE" --timestamp \
            "build/distribution/MicPin.dmg"

      - name: Faire notariser le disque
        run: |
          xcrun notarytool submit build/distribution/MicPin.dmg \
            --keychain-profile "micpin" \
            --wait \
            --timeout 30m

          xcrun stapler staple build/distribution/MicPin.dmg

          # Le vérificateur de mise à jour exige exactement ce verdict avant
          # d'installer : autant s'assurer ici qu'il sera satisfait.
          spctl -a -vvv -t open --context context:primary-signature \
            build/distribution/MicPin.dmg

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION_TAG" \
            "build/distribution/MicPin.dmg#MicPin $VERSION_APP (macOS)" \
            --title "MicPin $VERSION_APP" \
            --generate-notes \
            || gh release upload "$VERSION_TAG" \
                 "build/distribution/MicPin.dmg#MicPin $VERSION_APP (macOS)" \
                 --clobber

      - name: Nettoyer le trousseau
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signature.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certificat.p12"
